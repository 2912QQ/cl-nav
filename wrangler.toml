name = "nav-site"
main = "src/index.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/uploads/*"]

[[d1_databases]]
binding = "DB"
database_name = "nav-db"
database_id = "769a6b18-f7af-40e0-aecd-ae0cfb700402"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "nav-uploads"
