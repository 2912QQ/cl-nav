name = "cl-nav"
main = "src/index.js"
compatibility_date = "2025-09-01"
keep_vars = true

[assets]
directory = "./public"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/uploads/*"]

# 不写 ID：首次部署时 Cloudflare 会自动创建并绑定
[[d1_databases]]
binding = "DB"

[[kv_namespaces]]
binding = "KV"
